name: Instagram recruitment collection
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      initialize:
        description: 'Seed initial sources and connection, preserving website edits'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: instagram-recruitment
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}
      INSTAGRAM_ENCRYPTION_KEY: ${{ secrets.INSTAGRAM_ENCRYPTION_KEY }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
      INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
      INSTAGRAM_API_VERSION: ${{ secrets.INSTAGRAM_API_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm test:instagram
      - run: node --test scripts/instagramPlatform.test.mjs
      - name: Run website-managed collector
        env:
          INITIALIZE: ${{ inputs.initialize }}
        shell: bash
        run: |
          args=()
          if [[ "$INITIALIZE" == "true" ]]; then args+=(--initialize); fi
          node scripts/instagramWorker.mjs "${args[@]}"
