name: India Instagram outdoor job research
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: india-instagram-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
      INSTAGRAM_API_VERSION: ${{ secrets.INSTAGRAM_API_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/instagram.test.mjs
      - run: node scripts/scanIndiaInstagram.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: india-instagram-research
          path: work/india-instagram-scan.json
          retention-days: 3
